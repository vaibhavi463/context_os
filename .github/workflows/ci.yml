name: ContextOS CI/CD Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  quality-test-eval:
    name: Lint, Build, Test & AI Benchmark
    runs-on: ubuntu-latest

    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_USER: contextos
          POSTGRES_PASSWORD: contextos_dev_pass
          POSTGRES_DB: contextos_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U contextos -d contextos_db"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Install Backend Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install setuptools bandit pytest-cov
          pip install -e .[dev]

      - name: Install & Build Frontend
        run: |
          cd frontend
          npm install
          npm run build

      - name: Code Formatting & Ruff Lint
        run: |
          ruff check backend/app evals/

      - name: Static Security Scan (Bandit)
        run: |
          bandit -r backend/app -x tests/

      - name: Wait for Services Readiness
        run: |
          sleep 3

      - name: Run Database Migrations
        run: |
          alembic upgrade head
        env:
          PYTHONPATH: backend:.
          DATABASE_URL: postgresql+asyncpg://contextos:contextos_dev_pass@localhost:5432/contextos_db

      - name: Run Unit & Integration Tests with Coverage
        run: |
          pytest tests/ --cov=backend/app --cov-report=term-missing
        env:
          PYTHONPATH: backend:.
          DATABASE_URL: postgresql+asyncpg://contextos:contextos_dev_pass@localhost:5432/contextos_db

      - name: Run AI Evaluation Benchmark Suite
        run: |
          python evals/run_evals.py
        env:
          PYTHONPATH: backend:evals:.
          DATABASE_URL: postgresql+asyncpg://contextos:contextos_dev_pass@localhost:5432/contextos_db

      - name: Docker Image Build Check
        run: |
          docker build -t contextos-api:latest -f backend/Dockerfile .
